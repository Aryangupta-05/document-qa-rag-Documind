name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend CI (Python & FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax & compilation check
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/config.py
          python -m py_compile backend/app/routers/*.py
          python -m py_compile backend/app/services/*.py

      - name: Verify application loading
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          cd backend
          python -c "import app.main; print('Backend loaded successfully!')"

  frontend-check:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build
